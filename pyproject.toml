[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "api-health-checker"
version = "1.0.0"
description = "A configurable Python tool for monitoring API health, validating responses, and tracking historical performance."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"